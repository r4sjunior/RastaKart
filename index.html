<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Rasta Kart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070c; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  #app { position:fixed; inset:0; }
  #gl { display:block; width:100%; height:100%; touch-action:none; }
  #ui-root { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #boot { position:fixed; inset:0; z-index:50; display:grid; place-items:center;
          background:radial-gradient(120% 90% at 50% 25%, #12301b 0%, #07100b 55%, #05070c 100%); }
  #boot .inner { text-align:center; }
  #boot h1 { font-size:clamp(34px,7vw,76px); font-weight:900; letter-spacing:-.03em; line-height:1;
             background:linear-gradient(100deg,#1fbf4a 0%,#f7d417 45%,#e0322c 100%);
             -webkit-background-clip:text; background-clip:text; color:transparent; }
  #boot .bar { margin:22px auto 0; width:min(320px,64vw); height:5px; border-radius:99px;
               background:rgba(255,255,255,.12); overflow:hidden; }
  #boot .bar i { display:block; height:100%; width:0%; border-radius:99px;
                 background:linear-gradient(90deg,#1fbf4a,#f7d417,#e0322c); transition:width .25s ease; }
  #boot p { margin-top:12px; font-size:12px; letter-spacing:.16em; text-transform:uppercase;
            color:rgba(255,255,255,.45); font-variant-numeric:tabular-nums; }
  #boot.done { opacity:0; pointer-events:none; transition:opacity .5s ease; }
</style>
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>
    <div id="ui-root"></div>
  </div>
  <div id="boot"><div class="inner">
    <h1>RASTA&nbsp;KART</h1>
    <div class="bar"><i id="boot-bar"></i></div>
    <p id="boot-msg">carregando</p>
  </div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
